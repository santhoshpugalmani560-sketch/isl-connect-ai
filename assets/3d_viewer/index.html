<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0,
             maximum-scale=1.0, user-scalable=no"
  >

  <title>ISL 3D Avatar</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #101827;
      font-family: Arial, sans-serif;
    }

    #viewer {
      width: 100%;
      height: 100%;
    }

    #status {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      color: white;
      background: rgba(20, 35, 55, 0.85);
      padding: 12px;
      border-radius: 10px;
      font-size: 13px;
      z-index: 2;
      text-align: center;
    }

    #controls {
      position: absolute;
      bottom: 15px;
      left: 10px;
      right: 10px;
      display: flex;
      gap: 8px;
      justify-content: center;
      z-index: 3;
    }

    button {
      padding: 11px 14px;
      border: none;
      border-radius: 10px;
      background: #2496ed;
      color: white;
      font-size: 13px;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <div id="viewer"></div>

  <div id="status">Loading 3D ISL avatar...</div>

  <div id="controls">
    <button onclick="playAnimation()">Play</button>
    <button onclick="stopAnimation()">Stop</button>
    <button onclick="resetCamera()">Reset View</button>
  </div>

  <script type="module">
    import * as THREE from
      'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

    import { GLTFLoader } from
      'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';

    const viewer = document.getElementById('viewer');
    const statusBox = document.getElementById('status');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x101827);

    const camera = new THREE.PerspectiveCamera(
      40,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );

    camera.position.set(0, 1.4, 4);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: false
    });

    renderer.setPixelRatio(
      Math.min(window.devicePixelRatio, 2)
    );

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

    renderer.outputColorSpace = THREE.SRGBColorSpace;

    viewer.appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xffffff, 0x526078, 2));

    const keyLight = new THREE.DirectionalLight(0xffffff, 2.5);
    keyLight.position.set(3, 5, 5);
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0x80caff, 1);
    fillLight.position.set(-4, 2, -3);
    scene.add(fillLight);

    const loader = new GLTFLoader();

    let model = null;
    let mixer = null;
    let animationActions = [];
    let activeAction = null;

    const clock = new THREE.Clock();

    /*
      This example loads the animation GLB itself.
      Its character and animation are kept together,
      avoiding an unverified skeleton mismatch.
    */
    loader.load(
      '../animations/Good_morning_animation_11.glb',

      function (gltf) {
        model = gltf.scene;
        scene.add(model);

        // Center the model and scale it to fit the viewer.
        const box = new THREE.Box3().setFromObject(model);
        const size = box.getSize(new THREE.Vector3());
        const center = box.getCenter(new THREE.Vector3());

        model.position.x -= center.x;
        model.position.z -= center.z;
        model.position.y -= box.min.y;

        const largestDimension = Math.max(
          size.x,
          size.y,
          size.z
        );

        if (largestDimension > 0) {
          model.scale.setScalar(2.2 / largestDimension);
        }

        mixer = new THREE.AnimationMixer(model);

        animationActions = gltf.animations.map((clip) => {
          return mixer.clipAction(clip);
        });

        statusBox.textContent = animationActions.length
          ? '3D avatar loaded. Animations: ' +
            gltf.animations.map((clip) => clip.name).join(', ')
          : '3D avatar loaded. No animation clips found.';

        if (animationActions.length > 0) {
          playAnimation();
        }

        console.log(
          'Available animation clips:',
          gltf.animations.map((clip) => clip.name)
        );
      },

      function (progress) {
        if (progress.total > 0) {
          const percent = Math.round(
            (progress.loaded / progress.total) * 100
          );

          statusBox.textContent =
            'Loading 3D avatar: ' + percent + '%';
        }
      },

      function (error) {
        console.error('GLB loading error:', error);

        statusBox.textContent =
          'Could not load the avatar. Check the GLB asset path and internet connection.';
      }
    );

    // Called by the buttons and Flutter WebView.
    window.playAnimation = function (animationName) {
      if (!mixer || animationActions.length === 0) {
        statusBox.textContent =
          'The avatar has no available animation to play.';
        return;
      }

      let selectedAction = null;

      if (animationName) {
        const wanted = animationName.toLowerCase();

        const index = animationActions.findIndex((action) => {
          return action.getClip().name.toLowerCase() === wanted;
        });

        if (index !== -1) {
          selectedAction = animationActions[index];
        }
      }

      // Without a matching name, play the first available clip.
      if (!selectedAction) {
        selectedAction = animationActions[0];
      }

      if (activeAction && activeAction !== selectedAction) {
        activeAction.fadeOut(0.2);
      }

      activeAction = selectedAction;
      activeAction.reset();
      activeAction.enabled = true;
      activeAction.setLoop(THREE.LoopRepeat, Infinity);
      activeAction.fadeIn(0.2);
      activeAction.play();

      statusBox.textContent =
        'Playing: ' + activeAction.getClip().name;
    };

    window.stopAnimation = function () {
      if (mixer) {
        mixer.stopAllAction();
        activeAction = null;
        statusBox.textContent = 'Animation stopped.';
      }
    };

    window.resetCamera = function () {
      camera.position.set(0, 1.4, 4);
      camera.lookAt(0, 1, 0);
    };

    window.addEventListener('resize', function () {
      camera.aspect =
        window.innerWidth / window.innerHeight;

      camera.updateProjectionMatrix();

      renderer.setSize(
        window.innerWidth,
        window.innerHeight
      );
    });

    function animate() {
      requestAnimationFrame(animate);

      const delta = Math.min(clock.getDelta(), 0.1);

      if (mixer) {
        mixer.update(delta);
      }

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
